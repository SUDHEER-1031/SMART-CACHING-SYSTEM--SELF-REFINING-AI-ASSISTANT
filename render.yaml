services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + Groq + LangChain + Firestore)
  # -------------------------------------------------------------
  - type: web
    name: smart-caching-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: api_request
        sync: false
      - key: api_compare
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite)
  # -------------------------------------------------------------
  - type: web
    name: smart-caching-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: smart-caching-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
